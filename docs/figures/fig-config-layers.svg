<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Configuration layers</title><desc id="d">The INI file is read, a profile overwrites single values, the -m flag overrides the mode, and the result is a typed, checked configuration. Precedence rules for rate, seed and rest value are shown.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="24" font-size="17" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">How the configuration is assembled (built in M1)</text>
<rect x="20" y="55" width="210" height="105" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="125" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">1  lcg2.ini</text>
<text x="125" y="99.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">every section and key</text>
<text x="125" y="116" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">syntax checked</text>
<text x="125" y="132.9" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">duplicates refused</text>
<rect x="250" y="55" width="210" height="105" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="355" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">2  -P NAME</text>
<text x="355" y="99.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">[profile NAME] lines</text>
<text x="355" y="116" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">out.P2.line = ao1</text>
<text x="355" y="132.9" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">overwrite single values</text>
<rect x="480" y="55" width="210" height="105" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="585" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">3  -m cc or vc</text>
<text x="585" y="99.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">overrides rig.mode;</text>
<text x="585" y="116" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">recorded as</text>
<text x="585" y="132.9" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">'set on the command line'</text>
<rect x="710" y="55" width="210" height="105" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="815" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">4  typed Config</text>
<text x="815" y="99.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">units, ranges, lines,</text>
<text x="815" y="116" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">limits, rest values</text>
<text x="815" y="132.9" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">all checked</text>
<line x1="230" y1="107" x2="250" y2="107" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="460" y1="107" x2="480" y2="107" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="690" y1="107" x2="710" y2="107" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<text x="470" y="190" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">The table after step 3 is printed by  lcg2 -n -v  and is what the run archive will store.</text>
<text x="20" y="235" font-size="14" text-anchor="start" font-weight="bold" fill="#111827" dominant-baseline="central">Precedence (strongest first)</text>
<rect x="20" y="255" width="290" height="120" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="165" y="272" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Sampling rate</text>
<text x="165" y="307.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">1  rate written in the stimulus</text>
<text x="165" y="323.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">2  -r (a different value is an error)</text>
<text x="165" y="339.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">3  [rig] rate in the configuration</text>
<rect x="325" y="255" width="290" height="120" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="470" y="272" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Seed</text>
<text x="470" y="307.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">1  -s on the command line</text>
<text x="470" y="323.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">2  seed written in the stimulus</text>
<text x="470" y="339.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">3  drawn at the start and recorded</text>
<rect x="630" y="255" width="290" height="120" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="775" y="272" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Rest value</text>
<text x="775" y="307.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">1  rest in the stimulus (named channels)</text>
<text x="775" y="323.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">2  rest in [out] (idle outputs)</text>
<text x="775" y="339.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">3  0 (digital: the stimulus value, else 0)</text>
<text x="470" y="400" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">Rate and seed are combined with the stimulus in M2; today -n shows the command-line and file values.</text>
</svg>
