<text x="225" y="256.35" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">hardware spike</text>
<text x="225" y="270.65" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">(throwaway C)</text>
<rect x="320" y="215" width="150" height="80" rx="9" fill="#fdf2e0" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="395" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">M6</text>
<text x="395" y="263.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">DAQmx backend</text>
<rect x="490" y="215" width="150" height="80" rx="9" fill="#fdf2e0" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="565" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">M7</text>
<text x="565" y="256.35" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">bring-up on</text>
<text x="565" y="270.65" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">the rig</text>
<rect x="660" y="215" width="150" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="735" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">M8</text>
<text x="735" y="263.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">docs, v0.1</text>
<text x="470" y="315" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">hardware: waits for the rig host (USB-6343 is not supported by NI-DAQmx on Linux)</text>
</svg>
