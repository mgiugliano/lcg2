<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Multi-patch addressing</title><desc id="d">The stimulus names only P1, so ao0 is driven and ao1 holds its rest value, while both analog inputs ai0 and ai1 are recorded.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="24" font-size="17" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Multi-patch: drive one pipette, record all of them</text>
<rect x="330" y="55" width="290" height="290" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="475" y="200" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central"></text>
<text x="475" y="75" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">acquisition board</text>
<rect x="350" y="95" width="250" height="44" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="475" y="117" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">ao0  =  [out P1]  (driven)</text>
<rect x="350" y="150" width="250" height="44" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="475" y="172" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">ao1  =  [out P2]  (idle, at rest)</text>
<rect x="350" y="225" width="250" height="44" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="475" y="247" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">ai0  =  [in P1]  (recorded)</text>
<rect x="350" y="280" width="250" height="44" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="475" y="302" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">ai1  =  [in P2]  (recorded)</text>
<rect x="710" y="90" width="210" height="100" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="815" y="131.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">cell P1</text>
<text x="815" y="148.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">current is injected</text>
<rect x="710" y="225" width="210" height="100" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="815" y="266.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">cell P2</text>
<text x="815" y="283.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">only listened to</text>
<line x1="600" y1="117" x2="710" y2="117" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
<line x1="600" y1="172" x2="710" y2="262" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="710" y1="150" x2="600" y2="247" stroke="#1b7f3b" stroke-width="2" marker-end="url(#ah)"/>
<line x1="710" y1="300" x2="600" y2="302" stroke="#1b7f3b" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="90" width="270" height="150" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="155" y="107" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">the stimulus names only P1</text>
<text x="155" y="142.3" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">channel P1 unit=pA {</text>
<text x="155" y="157.9" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">    1s dc(0)</text>
<text x="155" y="173.5" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">    500ms pulses(...)</text>
<text x="155" y="189.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">    1s dc(0)</text>
<text x="155" y="204.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">}</text>
<line x1="290" y1="117" x2="350" y2="117" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
<text x="155" y="264.4" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">A channel without an [out] section is an error.</text>
<text x="155" y="280" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">An [out] the stimulus does not name is idle:</text>
<text x="155" y="295.6" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">it holds its rest value (dashed arrow).</text>
<text x="470" y="372" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">Every [in] section is recorded in every trial, whichever outputs are driven.  skip = yes in a profile drops one.</text>
</svg>
