<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">NEURON backend</title><desc id="d">lcg2 converts the stimulus volts back to pA or mV, sends them through two pipes to lcg2_neuron.py, which steps the NEURON cells and returns what the electrodes measure; lcg2 turns that back into volts and records it.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="24" font-size="17" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">device = neuron: how lcg2 and NEURON talk (built, M3b)</text>
<rect x="20" y="60" width="190" height="100" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="115" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">lcg2 (C)</text>
<text x="115" y="104.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">stimulus -&gt; volts</text>
<text x="115" y="118.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">inverse of the amplifier</text>
<text x="115" y="132.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">(gain, calibration)</text>
<rect x="280" y="60" width="190" height="100" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="375" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">two pipes</text>
<text x="375" y="104.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">JSON line + raw floats</text>
<text x="375" y="118.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">pA / mV / ns</text>
<text x="375" y="132.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">blocks of 0.1 s</text>
<rect x="540" y="60" width="180" height="100" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="630" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">lcg2_neuron.py</text>
<text x="630" y="104.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">builds the cells from</text>
<text x="630" y="118.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">[cell] and [synapse],</text>
<text x="630" y="132.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">steps them sample by sample</text>
<rect x="770" y="60" width="150" height="100" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="845" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">NEURON</text>
<text x="845" y="104.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">your model:</text>
<text x="845" y="118.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">built in, .py, .hoc,</text>
<text x="845" y="132.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">.swc, .mod</text>
<line x1="210" y1="100" x2="280" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="470" y1="100" x2="540" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="720" y1="100" x2="770" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="770" y1="135" x2="720" y2="135" stroke="#111827" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="540" y1="135" x2="470" y2="135" stroke="#111827" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="280" y1="135" x2="210" y2="135" stroke="#111827" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="245" y="90" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">command</text>
<text x="245" y="150" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">measured</text>
<rect x="20" y="215" width="190" height="90" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="115" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">what is kept</text>
<text x="115" y="254.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">HDF5 file + run folder</text>
<text x="115" y="268.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">network.json, model files,</text>
<text x="115" y="282.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">neuron.log, SHA256SUMS</text>
<line x1="115" y1="160" x2="115" y2="215" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="280" y="215" width="440" height="90" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="500" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">time</text>
<text x="500" y="254.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">a trial: advance through the pause at rest values,</text>
<text x="500" y="268.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">then block by block: set the command, take the steps,</text>
<text x="500" y="282.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">read the electrodes. The cells keep their state.</text>
<text x="470" y="335" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">A pipette P1 is attached to [cell P1]; mV commands clamp voltage, pA commands inject current.</text>
</svg>
