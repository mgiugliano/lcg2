<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LCG2 overview</title><desc id="d">Three inputs (stimulus text, configuration file, command line) enter the lcg2 program, which reads and checks them, renders with StimGen, runs a trial engine, talks to a backend (loopback, NEURON or the board) and writes a run archive.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="24" font-size="17" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">LCG2: what goes in, what happens, what comes out</text>
<rect x="20" y="60" width="210" height="80" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="125" y="77" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Stimulus (StimGen 2)</text>
<text x="125" y="100.05" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">step.sg, a protocol,</text>
<text x="125" y="116.95" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">or -e 'TEXT'</text>
<rect x="20" y="170" width="210" height="80" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="125" y="187" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Configuration (INI)</text>
<text x="125" y="210.05" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">[rig] [out P1] [in P1]</text>
<text x="125" y="226.95" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">[profile NAME]</text>
<rect x="20" y="280" width="210" height="80" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="125" y="297" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Command line</text>
<text x="125" y="320.05" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">-c -P -m -r -s -T</text>
<text x="125" y="336.95" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">-t -e -p -n -q -v</text>
<rect x="270" y="50" width="390" height="400" rx="12" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="465" y="68" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">lcg2 (a C99 program)</text>
<rect x="290" y="85" width="350" height="70" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="465" y="102" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">1  Read and check   (M0, M1)</text>
<text x="465" y="120.05" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">command line, INI, profiles, units, checks</text>
<text x="465" y="136.95" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">cli.c  config.c  units.c  main.c</text>
<rect x="290" y="175" width="350" height="70" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="465" y="192" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">2  Render with StimGen   (M2)</text>
<text x="465" y="210.05" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">trials as samples, units and every sample checked</text>
<text x="465" y="226.95" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">only sg_api_* of StimGen 2 (stim.c, json.c)</text>
<rect x="290" y="265" width="350" height="70" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="465" y="282" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">3  Trial engine   (M3)</text>
<text x="465" y="308.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">schedule, rest values, delays, Ctrl-C = outputs to rest</text>
<rect x="290" y="355" width="350" height="70" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="465" y="372" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">4  Backend interface   (M3, provisional)</text>
<text x="465" y="398.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">one interface: write outputs, read inputs</text>
<line x1="465" y1="155" x2="465" y2="175" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="465" y1="245" x2="465" y2="265" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="465" y1="335" x2="465" y2="355" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270" y="480" width="120" height="56" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="330" y="499.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">built-in</text>
<text x="330" y="516.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">loopback</text>
<rect x="405" y="480" width="130" height="56" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="470" y="499.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">NEURON</text>
<text x="470" y="516.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">simulator (M3b)</text>
<rect x="550" y="480" width="160" height="56" rx="9" fill="#fdf2e0" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="630" y="499.55" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">NI USB-6343</text>
<text x="630" y="516.45" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">(M6, host undecided)</text>
<line x1="330" y1="425" x2="330" y2="480" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="470" y1="425" x2="470" y2="480" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="630" y1="425" x2="630" y2="480" stroke="#111827" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="720" y="150" width="200" height="190" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="820" y="167" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Run archive   (M4)</text>
<text x="820" y="211.25" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">YYYYMMDD_HHMMSS.h5</text>
<text x="820" y="228.15" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">(trials, inputs, outputs)</text>
<text x="820" y="245.05" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central"></text>
<text x="820" y="261.95" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">.YYYYMMDD_HHMMSS/</text>
<text x="820" y="278.85" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">config, command, stimulus,</text>
<text x="820" y="295.75" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">trials, log, SHA-256</text>
<line x1="660" y1="245" x2="720" y2="245" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="230" y1="100" x2="270" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="230" y1="210" x2="270" y2="210" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="230" y1="320" x2="270" y2="320" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="568" width="26" height="16" rx="9" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="2"/>
<text x="33" y="576" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central"></text>
<text x="54" y="576" font-size="12" text-anchor="start" font-weight="normal" fill="#111827" dominant-baseline="central">built and tested</text>
<rect x="170" y="568" width="26" height="16" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="183" y="576" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central"></text>
<text x="204" y="576" font-size="12" text-anchor="start" font-weight="normal" fill="#111827" dominant-baseline="central">designed, not built yet</text>
<rect x="360" y="568" width="26" height="16" rx="9" fill="#fdf2e0" stroke="#b45309" stroke-width="2" stroke-dasharray="7 4"/>
<text x="373" y="576" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central"></text>
<text x="394" y="576" font-size="12" text-anchor="start" font-weight="normal" fill="#111827" dominant-baseline="central">waits for a decision</text>
</svg>
