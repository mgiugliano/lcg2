<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">From protocol to run</title><desc id="d">A protocol is expanded into trials, each trial is rendered, LCG2 checks units and limits for all trials, then the engine plays them one by one through a backend and the HDF5 writer and archive record them.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="24" font-size="17" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">How a protocol becomes trials (StimGen 2) and then a run (LCG2, from M2)</text>
<rect x="20" y="60" width="190" height="80" rx="9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/>
<text x="115" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">protocol text</text>
<text x="115" y="94.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">sweep amp = -300..300pA</text>
<text x="115" y="108.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">repeat 3, order shuffled</text>
<text x="115" y="122.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">period 5s</text>
<rect x="250" y="60" width="190" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="345" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">sg_api_expand</text>
<text x="345" y="94.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">ordered list of trials,</text>
<text x="345" y="108.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">each with condition,</text>
<text x="345" y="122.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">seed, timing</text>
<rect x="480" y="60" width="200" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="580" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">sg_api_render_trial</text>
<text x="580" y="94.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">one trial at a time:</text>
<text x="580" y="108.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">samples of every channel</text>
<text x="580" y="122.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">in pA / mV / 0-1</text>
<rect x="720" y="60" width="200" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="820" y="77" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">LCG2 checks (M2)</text>
<text x="820" y="94.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">units checked against [out]</text>
<text x="820" y="108.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">wanted and written volts</text>
<text x="820" y="122.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">checked against limits</text>
<line x1="210" y1="100" x2="250" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="440" y1="100" x2="480" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="680" y1="100" x2="720" y2="100" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<text x="470" y="180" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">Before the run, EVERY trial is rendered and checked. If any sample would clip, nothing is played and the error names trial, channel and sample.</text>
<rect x="20" y="215" width="210" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="125" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">engine (M3)</text>
<text x="125" y="249.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">trial 1, 2, 3 ... N</text>
<text x="125" y="263.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">one after the other,</text>
<text x="125" y="277.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">rendered again when needed</text>
<rect x="270" y="215" width="210" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="375" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">backend</text>
<text x="375" y="256.35" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">write outputs, read inputs,</text>
<text x="375" y="270.65" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">rest values in between</text>
<rect x="520" y="215" width="190" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="615" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">HDF5 writer (M4)</text>
<text x="615" y="256.35" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">block per trial,</text>
<text x="615" y="270.65" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">flushed after each</text>
<rect x="750" y="215" width="170" height="80" rx="9" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 4"/>
<text x="835" y="232" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">hidden folder</text>
<text x="835" y="249.2" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">config, command,</text>
<text x="835" y="263.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">stimulus, trials,</text>
<text x="835" y="277.8" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">log, SHA-256</text>
<line x1="230" y1="255" x2="270" y2="255" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="480" y1="255" x2="520" y2="255" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<line x1="710" y1="255" x2="750" y2="255" stroke="#111827" stroke-width="2" marker-end="url(#ah)"/>
<text x="470" y="335" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">Rendering is deterministic: the same text, rate and seed give the same samples on a given platform (StimGen reproducibility level B).</text>
<text x="470" y="357" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">LCG2 only calls functions named sg_api_* and never edits StimGen; the version is pinned in STIMGEN_PIN.</text>
</svg>
