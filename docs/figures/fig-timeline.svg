<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Trial timing</title><desc id="d">Two timing modes of a protocol. With period, trials start at fixed intervals; with gap, each trial starts a fixed time after the previous one ended. Outputs rest between trials and inputs are recorded only during trials.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="24" font-size="17" text-anchor="middle" font-weight="bold" fill="#111827" dominant-baseline="central">Episodic recording: one block per trial, outputs at rest in between</text>
<text x="20" y="60" font-size="14" text-anchor="start" font-weight="bold" fill="#111827" dominant-baseline="central">period 5s   (start to start)</text>
<line x1="120" y1="86" x2="310" y2="86" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<text x="320" y="86" font-size="12" text-anchor="start" font-weight="normal" fill="#b45309" dominant-baseline="central">5 s from one start to the next</text>
<text x="20" y="120" font-size="12" text-anchor="start" font-weight="normal" fill="#1d4ed8" dominant-baseline="central">outputs</text>
<text x="20" y="152" font-size="12" text-anchor="start" font-weight="normal" fill="#1b7f3b" dominant-baseline="central">recorded</text>
<line x1="120" y1="120" x2="880" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="120" y="108" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="120" y="140" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<rect x="310" y="108" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="310" y="140" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<rect x="500" y="108" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="500" y="140" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<rect x="690" y="108" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="690" y="140" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<text x="20" y="205" font-size="14" text-anchor="start" font-weight="bold" fill="#111827" dominant-baseline="central">gap 2s   (end to start)</text>
<line x1="196" y1="231" x2="272" y2="231" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<text x="282" y="231" font-size="12" text-anchor="start" font-weight="normal" fill="#b45309" dominant-baseline="central">2 s from one end to the next start</text>
<text x="20" y="265" font-size="12" text-anchor="start" font-weight="normal" fill="#1d4ed8" dominant-baseline="central">outputs</text>
<text x="20" y="297" font-size="12" text-anchor="start" font-weight="normal" fill="#1b7f3b" dominant-baseline="central">recorded</text>
<line x1="120" y1="265" x2="880" y2="265" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="120" y="253" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="120" y="285" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<rect x="272" y="253" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="272" y="285" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<rect x="424" y="253" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="424" y="285" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<rect x="576" y="253" width="76" height="24" rx="3" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="576" y="285" width="76" height="24" rx="3" fill="#e6f4ea" stroke="#1b7f3b" stroke-width="1.5"/>
<line x1="120" y1="335" x2="120" y2="341" stroke="#111827" stroke-width="1.5"/>
<text x="120" y="353" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">0 s</text>
<line x1="310" y1="335" x2="310" y2="341" stroke="#111827" stroke-width="1.5"/>
<text x="310" y="353" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">5 s</text>
<line x1="500" y1="335" x2="500" y2="341" stroke="#111827" stroke-width="1.5"/>
<text x="500" y="353" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">10 s</text>
<line x1="690" y1="335" x2="690" y2="341" stroke="#111827" stroke-width="1.5"/>
<text x="690" y="353" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">15 s</text>
<line x1="880" y1="335" x2="880" y2="341" stroke="#111827" stroke-width="1.5"/>
<text x="880" y="353" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">20 s</text>
<line x1="120" y1="335" x2="880" y2="335" stroke="#111827" stroke-width="1.5"/>
<text x="20" y="335" font-size="12" text-anchor="start" font-weight="normal" fill="#111827" dominant-baseline="central">time</text>
<text x="470" y="385" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">Between trials the outputs hold their rest value (dashed line); nothing is recorded.</text>
<text x="470" y="407" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827" dominant-baseline="central">A trial that cannot start on time (previous one still running, USB start-up) starts as soon as it can;</text>
<text x="470" y="427" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280" dominant-baseline="central">the real start time and delay of every trial are recorded and printed.  (Built, M3; recorded in the data file since M4.)</text>
</svg>
