; LCG2 example configuration: a two-pipette rig with one digital line.
;
; Gains are "channel units per volt": an output with gain_cc = 400 and
; unit_cc = pA turns 400 pA into 1 V at the board; an input with gain_cc = 100
; and unit_cc = mV turns 1 V at the board into 100 mV.  Choose the mode with
; -m cc or -m vc (or write mode = cc|vc in [rig]).  Select a profile with
; -P single or -P swap.  Check it all without playing anything:
;
;     ./lcg2 -c examples/lcg2.ini -n -v -e 'x'
;
[rig]
device = sim
mode = cc
rate = 20kHz

[out P1]
line = ao0
gain_cc = 400
unit_cc = pA
gain_vc = 20
unit_vc = mV
limit = 5

[out P2]
line = ao1
gain_cc = 400
unit_cc = pA
gain_vc = 20
unit_vc = mV

[out TTL]
line = port0/line0
digital = yes

[in P1]
line = ai0
gain_cc = 100
unit_cc = mV
gain_vc = 1000
unit_vc = pA

[in P2]
line = ai1
gain_cc = 100
unit_cc = mV
gain_vc = 1000
unit_vc = pA

[profile single]
out.P2.skip = yes
in.P2.skip = yes

[profile swap]
out.P2.line = ao2
rig.rate = 10kHz
