[cell A]
model = pyramidal.py
apical_length = 200
electrode = apical(0.5)
[cell B]
model = simple_cell.hoc
template = SimpleCell
electrode = dend[1](0.5)
[cell C]
morphology = tiny.swc
biophysics = cell_tuning.py
init = start_depolarised.py
electrode = dend[0](1)
[cell D]
model = ball_and_stick
mechanisms = mod
[synapse A_B]
pre = A
post = B
weight = 2nS
delay = 2ms
post_location = dend[0](0.5)
