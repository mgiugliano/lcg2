; Two virtual cells and a synapse (a DESIGN PREVIEW).
;
; The NEURON backend arrives in milestone M3b. Today this file is only read
; and checked for structure: [cell] and [synapse] sections are counted, their
; keys are not validated yet. The keys below are the intended ones (SPEC 11).
;
;     ./lcg2 -c examples/neuron_pair.ini -n examples/pair.sg
;
[rig]
device     = neuron
sim_script = lcg2_neuron.py     ; the generic adapter, shipped with LCG2 (M3b)
mode       = cc
rate       = 20kHz

[out P1]
line = ao0
gain_cc = 400
unit_cc = pA

[out P2]
line = ao1
gain_cc = 400
unit_cc = pA

[in P1]
line = ai0
gain_cc = 100
unit_cc = mV

[in P2]
line = ai1
gain_cc = 100
unit_cc = mV

[cell P1]
model = hh_soma         ; a built-in Hodgkin-Huxley soma

[cell P2]
model = hh_soma

[synapse P1_P2]
pre    = P1
post   = P2
type   = exp2
weight = 0.01           ; uS
delay  = 1ms
