; Two virtual cells and a synapse, on the NEURON simulator (milestone M3b).
;
; Drive P1 and look at P2: it answers a spike of P1 after the synaptic delay.
; sim_python must be a Python that has NEURON (pip install neuron); the path below
; is the one on the development Mac.
;
;     ./lcg2 -c examples/neuron_pair.ini -n examples/pair.sg      (builds the cells, plays nothing)
;     cd ~/my_data && /path/to/lcg2 -c /path/to/examples/neuron_pair.ini /path/to/examples/pair.sg
;
[rig]
device     = neuron
sim_python = /opt/homebrew/opt/python@3.11/bin/python3.11
mode       = cc
rate       = 20kHz

[out P1]
line = ao0
gain_cc = 400
unit_cc = pA

[out P2]
line = ao1
gain_cc = 400
unit_cc = pA

[in P1]
line = ai0
gain_cc = 100
unit_cc = mV

[in P2]
line = ai1
gain_cc = 100
unit_cc = mV

[cell P1]
model = hh_soma         ; a built-in Hodgkin-Huxley soma

[cell P2]
model = hh_soma

[synapse P1_P2]
pre    = P1
post   = P2
type   = exp2
weight = 0.01           ; uS
delay  = 1ms
