[rig]
device = neuron
sim_python = python3     ; a Python that has NEURON: the virtual environment's (see the README), or set LCG2_SIM_PYTHON
mode = cc
rate = 20kHz
[out P1]
line = ao0
gain_cc = 400
unit_cc = pA
gain_vc = 20
unit_vc = mV
[in P1]
line = ai0
gain_cc = 100
unit_cc = mV
gain_vc = 1000
unit_vc = pA
[cell P1]
model = hh_soma
