; LCG2 student kit: a virtual patch-clamp rig on the NEURON simulator.
;
; You do not need to know NEURON.  This file says what is on the rig:
;   [rig]   which Python has NEURON, and the amplifier mode
;   [out P1] / [in P1]   the pipette P1: what you command (pA in current clamp, mV in voltage clamp)
;                        and what you record (mV in current clamp, pA in voltage clamp)
;   [cell P1]            the cell the pipette is attached to
;
; Change the cell without touching anything else:
;     lcg2 -c rig.ini -P ballstick ...     a soma with one dendrite
;     lcg2 -c rig.ini -P pyramidal ...     a model written in Python (pyramidal.py)
;     lcg2 -c rig.ini -P hoc ...           a model written in hoc (simple_cell.hoc)
; and see README.md for the exercises.

[rig]
device     = neuron
sim_python = python3     ; a Python that has NEURON: the virtual environment's (see the README), or set LCG2_SIM_PYTHON
mode       = cc
rate       = 20kHz

[out P1]
line    = ao0
gain_cc = 400            ; 400 pA per volt of the command
unit_cc = pA
gain_vc = 20
unit_vc = mV

[in P1]
line    = ai0
gain_cc = 100            ; 100 mV per volt at the board
unit_cc = mV
gain_vc = 20000           ; 20 nA per volt: the soma of an HH cell carries tens of nA
unit_vc = pA

[cell P1]
model = hh_soma          ; the default: a Hodgkin-Huxley soma (20 um)

[profile ballstick]
cell.P1.model = ball_and_stick

[profile pyramidal]
cell.P1.model = pyramidal.py

[profile hoc]
cell.P1.model    = simple_cell.hoc
cell.P1.template = SimpleCell

[profile ballstick_dend]
cell.P1.model     = ball_and_stick
cell.P1.electrode = dend(1)

[profile big]
cell.P1.diam = 40
cell.P1.length = 40

[profile hot]
rig.sim_celsius = 22
