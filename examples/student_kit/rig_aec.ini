; Active electrode compensation (AEC) practice: a PASSIVE cell (no voltage-gated channels, so one membrane time
; constant) recorded through a bad electrode (50 MOhm, 3 pF). Inject noise (aec_noise.sg), then let aec.py remove the
; electrode from the recording. -P ideal records the same cell with no electrode, as the reference.
[rig]
device     = neuron
sim_python = /opt/homebrew/opt/python@3.11/bin/python3.11   ; a Python that has NEURON (pip install neuron)
mode       = cc
rate       = 20kHz

[out P1]
line    = ao0
gain_cc = 400
unit_cc = pA

[in P1]
line    = ai0
gain_cc = 100
unit_cc = mV

; a SECOND, ideal electrode on the same cell: it records the true membrane potential, which a real
; experiment never has, so that we can check what the compensation did
[in V0]
line    = ai1
gain_cc = 100
unit_cc = mV

[cell P1]
model                 = hh_soma
gnabar                = 0          ; no sodium and no potassium channels: only the leak
gkbar                 = 0
electrode_resistance  = 50         ; MOhm
electrode_capacitance = 3          ; pF

[cell V0]
same_as = P1             ; the cell of P1, with its own (here ideal) electrode

[profile ideal]
cell.P1.electrode_resistance  = 0
cell.P1.electrode_capacitance = 0
