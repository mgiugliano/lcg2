; The same rig with the cell from two_compartment.py (tutorial 6).

[rig]
device     = neuron
sim_python = /opt/homebrew/opt/python@3.11/bin/python3.11   ; a Python that has NEURON (pip install neuron)
mode       = cc
rate       = 20kHz

[out P1]
line    = ao0
gain_cc = 400            ; 400 pA per volt of the command
unit_cc = pA
gain_vc = 20
unit_vc = mV

[in P1]
line    = ai0
gain_cc = 100            ; 100 mV per volt at the board
unit_cc = mV
gain_vc = 20000           ; 20 nA per volt: the soma of an HH cell carries tens of nA
unit_vc = pA

[cell P1]
model       = two_compartment.py
dend_length = 200            ; um, a parameter of the model

[profile short]
cell.P1.dend_length = 50

[profile long]
cell.P1.dend_length = 800
