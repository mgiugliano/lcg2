; The same cell, recorded through a real-looking pipette and amplifier.
;
; A pipette is a resistor (electrode_resistance) in series with the cell and a capacitor
; (electrode_capacitance) to ground. In current clamp the amplifier sees the potential of the cell PLUS the
; voltage drop of the injected current across the electrode; the amplifier can subtract it (bridge_balance) and
; cancel the capacitance with positive feedback (cap_neutralization). In voltage clamp the series resistance
; limits the speed and the accuracy of the clamp (rs_compensation helps), and the pipette capacitance draws a
; transient (cp_compensation cancels it). recording_noise adds Gaussian noise to whatever is recorded.
;
; Profiles:  -P ideal       no electrode at all (the reference)
;            -P raw         current clamp, uncompensated
;            -P bridge      current clamp, bridge balance
;            -P balanced    current clamp, bridge balance and capacitance neutralisation
;            -P vc_raw      voltage clamp, uncompensated      (use with -m vc)
;            -P vc_comp     voltage clamp, compensated        (use with -m vc)
[rig]
device     = neuron
sim_python = /opt/homebrew/opt/python@3.11/bin/python3.11   ; a Python that has NEURON (pip install neuron)
mode       = cc
rate       = 20kHz

[out P1]
line    = ao0
gain_cc = 400
unit_cc = pA
gain_vc = 20
unit_vc = mV

[in P1]
line    = ai0
gain_cc = 100
unit_cc = mV
gain_vc = 20000
unit_vc = pA

[cell P1]
model                = hh_soma
electrode_resistance  = 50      ; MOhm
electrode_capacitance = 3       ; pF
recording_noise       = 0       ; mV (cc) or pA (vc), rms

[profile ideal]
cell.P1.electrode_resistance  = 0
cell.P1.electrode_capacitance = 0

[profile raw]
rig.sim_settle = 0s

[profile bridge]
cell.P1.bridge_balance = 50

[profile balanced]
cell.P1.bridge_balance    = 50
cell.P1.cap_neutralization = 2.5

[profile noisy]
cell.P1.recording_noise = 0.3

[profile vc_raw]
cell.P1.electrode_resistance = 10
cell.P1.electrode_capacitance = 5

[profile vc_comp]
cell.P1.electrode_resistance = 10
cell.P1.electrode_capacitance = 5
cell.P1.rs_compensation = 70
cell.P1.cp_compensation = 5
