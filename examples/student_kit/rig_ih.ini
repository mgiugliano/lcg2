; The same rig with a cell that has your own channel (channels/ih.mod, compiled automatically).

[rig]
device     = neuron
sim_python = /opt/homebrew/opt/python@3.11/bin/python3.11   ; a Python that has NEURON (pip install neuron)
mode       = cc
rate       = 20kHz
sim_settle = 2s          ; let the cell reach its true rest (Ih shifts it) before the first trial

[out P1]
line    = ao0
gain_cc = 400            ; 400 pA per volt of the command
unit_cc = pA
gain_vc = 20
unit_vc = mV

[in P1]
line    = ai0
gain_cc = 100            ; 100 mV per volt at the board
unit_cc = mV
gain_vc = 20000           ; 20 nA per volt: the soma of an HH cell carries tens of nA
unit_vc = pA

[cell P1]
model      = soma_ih.py
mechanisms = channels
gh         = 0.0005         ; S/cm2

[profile noih]
cell.P1.gh = 0
