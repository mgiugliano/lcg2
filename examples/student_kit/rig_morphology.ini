; The same rig, with a cell that comes from a morphology file (tiny.swc), biophysics you wrote
; (cell_tuning.py) and initialisation code (start_depolarised.py).  This is the pattern to follow
; for your own cell: morphology = your.swc, biophysics = yours.py, init = yours.py.
; Relative paths start in the folder of THIS file, so the kit can be copied anywhere.
[rig]
device     = neuron
sim_python = python3     ; a Python that has NEURON: the virtual environment's (see the README), or set LCG2_SIM_PYTHON
mode       = cc
rate       = 20kHz

[out P1]
line    = ao0
gain_cc = 400
unit_cc = pA

[in P1]
line    = ai0
gain_cc = 100
unit_cc = mV

[cell P1]
morphology = tiny.swc
biophysics = cell_tuning.py
init       = start_depolarised.py
electrode  = soma(0.5)           ; where the pipette is; dend[0](1) would be the tip of a dendrite
