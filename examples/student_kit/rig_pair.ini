; Two cells and a synapse: patch both, drive one, watch the other.
[rig]
device     = neuron
sim_python = python3     ; a Python that has NEURON: the virtual environment's (see the README), or set LCG2_SIM_PYTHON
mode       = cc
rate       = 20kHz

[out P1]
line = ao0
gain_cc = 400
unit_cc = pA
[out P2]
line = ao1
gain_cc = 400
unit_cc = pA
[in P1]
line = ai0
gain_cc = 100
unit_cc = mV
[in P2]
line = ai1
gain_cc = 100
unit_cc = mV

[cell P1]
model = hh_soma
[cell P2]
model = hh_soma

[synapse P1_P2]
pre    = P1
post   = P2
type   = exp2
tau1   = 0.5ms
tau2   = 3ms
weight = 0.0003          ; uS (0.3 nS: a subthreshold PSP; try 0.01 for a synapse strong enough to fire P2)
delay  = 2ms

[profile strong]
synapse.P1_P2.weight = 0.01
