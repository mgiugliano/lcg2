; Patching a cell, from the bath to whole-cell (tutorial L of docs/16).
;
; The pipette starts in the bath. At 2 s it touches the cell, at 3 s suction makes the seal, at 10 s the
; seal test (seal_test.sg) moves the holding potential to -70 mV, and at 14 s a pulse of suction breaks
; the patch (if it fails, there is another try at 16 s). Run it in voltage clamp:
;
;     lcg2 -m vc -c rig_patch.ini seal_test.sg
;
; and watch the resistance after every test pulse. What the pipette and the cell turn out to be (how good
; the seal is, how long it takes, whether the break-in works, the access resistance) is drawn from
; patch_seed: another seed is another cell; the same seed, the same cell. The values drawn are written in
; .STEM/network.json, to look at AFTER you have measured them.
;
; Profiles:  -P cell_attached   start sealed (cell-attached), break in at 3 s
;            -P whole_cell      start in whole-cell: the same cell, to record from it (also in current clamp)
;            -P no_offset       without nulling the pipette offset in the bath
;            -P other_cell      another pipette, another cell (another seed: this one does not seal well)
;            -P firing          a cell that fires on its own, sealed (cell-attached): use with cell_attached.sg
[rig]
device     = neuron
sim_python = python3     ; a Python that has NEURON: the virtual environment's (see the README), or set LCG2_SIM_PYTHON
mode       = vc
sim_dt     = 5us         ; the whole-cell transient lasts about 0.1 ms: a fine step keeps it accurate (see docs/14)

[out P1]
line    = ao0
gain_vc = 20
unit_vc = mV
gain_cc = 400
unit_cc = pA

[in P1]
line          = ai0
gain_vc       = 1000      ; pA per volt: 10 nA at 10 V
unit_vc       = pA
gain_cc       = 100
unit_cc       = mV
membrane_test = yes       ; after each trial: R (pipette, seal), and in the cell Ra, Rm, Cm

[cell P1]
model = hh_soma
; what you choose: the pipette, and what you expect of the seal and the access
pipette_resistance  = 5          ; MOhm, as measured in the bath
pipette_capacitance = 4          ; pF
cp_compensation     = 4          ; pF: the amplifier cancels the pipette capacitance (set it in the bath)
access_resistance   = 12         ; MOhm after the break-in: a typical value; each cell differs
seal_target         = 2          ; GOhm: what a good seal reaches; each seal differs, and some fail
liquid_junction_potential = 12   ; mV: a K-gluconate pipette solution
patch_seed          = 51
; what happens, and when (from the start of the first trial)
patch_contact  = 2s
patch_suction  = 3s
patch_break_in = 14s, 16s

[profile cell_attached]
cell.P1.patch_start    = cell_attached
cell.P1.patch_contact  =
cell.P1.patch_suction  =
cell.P1.patch_break_in = 3s

[profile whole_cell]
cell.P1.patch_start    = whole_cell
cell.P1.patch_contact  =
cell.P1.patch_suction  =
cell.P1.patch_break_in =

[profile no_offset]
cell.P1.pipette_offset = none

[profile other_cell]
cell.P1.patch_seed = 3

[profile firing]
cell.P1.el       = -30      ; mV: a leak that depolarises this cell enough to fire on its own
cell.P1.patch_start    = cell_attached
cell.P1.patch_contact  =
cell.P1.patch_suction  =
cell.P1.patch_break_in =
